<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday - Romantic Surprise</title>
  
  <!-- React 18, ReactDOM, & Babel CDN for Part 6 React Setup -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Poppins', sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      transition: background 0.8s ease;
    }

    .romantic-font {
      font-family: 'Dancing Script', cursive;
    }

    /* Card & Components */
    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(244, 114, 182, 0.35);
      border: 2px solid #fbcfe8;
      max-width: 700px;
      width: 90%;
      display: flex;
      flex-direction: row;
      gap: 30px;
      align-items: center;
      justify-content: center;
    }

    /* Mobile 2-Photo Grid Styles */
    .mobile-photo-grid {
      display: none;
    }

    @media (max-width: 640px) {
      .card {
        flex-direction: column;
        padding: 20px;
        gap: 15px;
      }
      .desktop-polaroid {
        display: none;
      }
      .mobile-photo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
        margin-bottom: 10px;
      }
    }

    /* Polaroid */
    .polaroid {
      background: #fff;
      padding: 10px 10px 24px 10px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      transform: rotate(-3deg);
      border: 1px solid #f1f5f9;
      text-align: center;
      width: 100%;
    }

    .desktop-polaroid {
      width: 220px;
    }

    .polaroid img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 8px;
    }

    .polaroid-text {
      color: #e11d48;
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* Passcode Keypad */
    .keypad-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .passcode-title {
      font-size: 22px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
    }

    .heart-dots {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .heart-dot {
      font-size: 26px;
      color: #fbcfe8;
      transition: color 0.2s ease, transform 0.2s ease;
      min-width: 30px;
      text-align: center;
    }

    .heart-dot.active {
      color: #e11d48;
      transform: scale(1.25);
    }

    .grid-keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 220px;
    }

    .key-btn {
      height: 52px;
      border-radius: 16px;
      border: none;
      background: #fdf2f8;
      color: #be185d;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(244, 114, 182, 0.15);
      transition: all 0.15s ease;
    }

    .key-btn:active {
      transform: scale(0.92);
      background: #fbcfe8;
    }

    .hint-text {
      font-size: 12px;
      color: #db2777;
      margin-top: 14px;
      opacity: 0.8;
    }

    /* Screen Transitions */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.5s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Floral Bloom Animation */
    #flower-screen {
      position: fixed;
      inset: 0;
      background: #fce7f3;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .bloom-flower {
      font-size: 100px;
      animation: bloomAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes bloomAnim {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(2.2) rotate(120deg); opacity: 1; }
      100% { transform: scale(3.5) rotate(240deg); opacity: 0; }
    }

    /* Hanging Moon */
    .hanging-bulb-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      margin-top: 0px;
    }

    .wire {
      width: 4px;
      height: 110px;
      background: #64748b;
    }

    .moon-bulb {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 35% 35%, #f1f5f9 0%, #cbd5e1 45%, #94a3b8 80%, #64748b 100%);
      box-shadow: inset -7px -7px 14px rgba(30, 41, 59, 0.4), 0 8px 25px rgba(0, 0, 0, 0.15);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .crater {
      position: absolute;
      border-radius: 50%;
      background: #64748b;
      opacity: 0.35;
      box-shadow: inset 1px 1px 3px rgba(15, 23, 42, 0.5);
      transition: all 0.6s ease;
    }
    .crater.c1 { width: 22px; height: 22px; top: 20px; left: 20px; }
    .crater.c2 { width: 14px; height: 14px; top: 54px; left: 32px; }
    .crater.c3 { width: 16px; height: 16px; top: 32px; left: 56px; }
    .crater.c4 { width: 11px; height: 11px; top: 62px; left: 60px; }

    .moon-bulb.glowing {
      background: radial-gradient(circle at 40% 40%, #ffffff 0%, #fffdf0 30%, #fef08a 65%, #facc15 100%);
      box-shadow: 0 0 25px #ffffff,
                  0 0 55px #fef08a,
                  0 0 95px #facc15,
                  0 0 140px rgba(250, 204, 21, 0.7);
      transform: scale(1.08);
    }

    .moon-bulb.glowing .crater {
      background: #eab308;
      opacity: 0.25;
      box-shadow: inset 1px 1px 2px rgba(202, 138, 4, 0.4);
    }

    .cord-string {
      width: 3px;
      height: 80px;
      background: #b45309;
      position: relative;
      display: flex;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .cord-ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f59e0b;
      border: 3px solid #b45309;
      position: absolute;
      bottom: -10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    /* Common Button */
    .btn-pink {
      background: #ec4899;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pink:hover {
      background: #db2777;
      transform: translateY(-2px);
    }

    /* ENVELOPE (3D Card) */
    .envelope-main-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      cursor: pointer;
      perspective: 1200px;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.6s;
    }

    .envelope-main-wrapper.is-open {
      transform: translateY(110px);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0s;
    }

    .photo-envelope {
      position: relative;
      width: 280px;
      height: 180px;
      border-radius: 16px;
      border: 3px solid #f472b6;
      box-shadow: 0 12px 30px rgba(225, 29, 72, 0.25);
      background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
      z-index: 10;
    }

    .bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 13px;
      display: block;
    }

    .envelope-top-triangle {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 137px solid transparent;
      border-right: 137px solid transparent;
      border-top: 92px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(1.5px);
      transform-origin: top;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 1.2s, z-index 0.1s 1.2s;
      z-index: 12;
    }

    .envelope-main-wrapper.is-open .envelope-top-triangle {
      transform: rotateX(180deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0s, z-index 0.1s 0.2s;
      z-index: 1;
    }

    .envelope-bottom-triangle {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 137px solid rgba(255, 255, 255, 0.25);
      border-right: 137px solid rgba(255, 255, 255, 0.25);
      border-bottom: 92px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(1.5px);
      border-radius: 0 0 13px 13px;
      z-index: 11;
      pointer-events: none;
    }

    .center-heart-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 13;
      transition: opacity 0.3s ease 1.4s, transform 0.3s ease 1.4s;
    }

    .envelope-main-wrapper.is-open .center-heart-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      transition: opacity 0.2s ease 0s, transform 0.2s ease 0s;
    }

    .card-wrapper {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 265px;
      height: 150px;
      z-index: 2;
      perspective: 1200px;
      transition:
        transform 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.5s,
        height 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.5s,
        z-index 0.1s 1.2s;
    }

    .envelope-main-wrapper.is-open .card-wrapper {
      transform: translateX(-50%) translateY(-290px);
      height: 320px;
      z-index: 25;
      transition:
        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.4s,
        height 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.4s,
        z-index 0.1s 0.4s;
    }

    .letter-card {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ECEBE3; /* Almond Milk Color */
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      transition: box-shadow 0.7s ease 0.5s;
      transform-style: preserve-3d;
    }

    .card-cover {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: #ECEBE3;
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0s;
      z-index: 5;
    }

    .envelope-main-wrapper.is-open .card-cover {
      transform: rotateY(-135deg);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1.1s;
    }

    .card-side-front {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: #ECEBE3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      padding: 15px;
      text-align: center;
    }

    .cover-badge {
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #be185d;
      margin-bottom: 4px;
    }

    .cover-main-title {
      font-size: 24px;
      color: #be185d;
      line-height: 1.1;
      margin: 4px 0;
    }

    .cover-icon {
      font-size: 24px;
      margin-top: 6px;
    }

    .card-side-back {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background-color: #ECEBE3;
      transform: rotateY(180deg);
      backface-visibility: hidden;
    }

    .card-body {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background-color: #ECEBE3;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      z-index: 1;
      color: #374151;
    }

    .card-body > div:first-child {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .letter-inner-title {
      font-size: 20px;
      color: #e11d48;
      text-align: center;
      margin-bottom: 2px;
      font-weight: 700;
    }

    .letter-inner-sub {
      font-size: 10px;
      color: #be185d;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .letter-text-block {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .highlight-pink-text {
      color: #e11d48;
      font-weight: 700;
    }

    .letter-footer-btns {
      margin-top: 10px;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-link-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 13px;
      cursor: pointer;
      padding: 4px;
      font-weight: 600;
    }

    .letter-footer-btns .btn-pink {
      padding: 8px 18px;
      font-size: 13px;
      gap: 4px;
    }

    /* Canvas Confetti */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
    }

    /* EXACT 3D COVERFLOW SLIDE TRANSITION (REACT + CAROUSEL STYLING) */
    .carousel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 30px 15px;
      position: relative;
      z-index: 2;
    }

    .floating-shape-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      bottom: -10%;
      font-size: 26px;
      animation: floatSmooth 9s linear infinite;
      opacity: 0.75;
      filter: drop-shadow(0 4px 10px rgba(255, 105, 180, 0.3));
    }

    @keyframes floatSmooth {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.85; }
      100% {
        transform: translateY(-115vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* 3D Curved Perspective Stage */
    .carousel-cards {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      margin: auto 0;
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .carousel-cards:active {
      cursor: grabbing;
    }

    .glass-card {
      position: absolute;
      width: 220px;
      height: 330px;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 16px 38px rgba(225, 29, 72, 0.22);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, filter 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      cursor: pointer;
      will-change: transform, opacity;
    }

    .card-img-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* 3D Coverflow Curve Physics Mapping */
    .card-center {
      transform: translateX(0) scale(1.08) translateZ(80px) rotateY(0deg);
      z-index: 10;
      opacity: 1;
      filter: drop-shadow(0 15px 30px rgba(225, 29, 72, 0.3));
    }

    .card-left {
      transform: translateX(-140px) scale(0.82) translateZ(-20px) rotateY(25deg);
      z-index: 5;
      opacity: 0.72;
    }

    .card-right {
      transform: translateX(140px) scale(0.82) translateZ(-20px) rotateY(-25deg);
      z-index: 5;
      opacity: 0.72;
    }

    .card-far-left {
      transform: translateX(-240px) scale(0.65) translateZ(-100px) rotateY(40deg);
      z-index: 2;
      opacity: 0.35;
    }

    .card-far-right {
      transform: translateX(240px) scale(0.65) translateZ(-100px) rotateY(-40deg);
      z-index: 2;
      opacity: 0.35;
    }

    .card-hidden {
      transform: translateX(0) scale(0.3) translateZ(-200px);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    .expanded-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 182, 193, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease-out;
    }

    .expanded-card {
      width: 100%;
      max-width: 380px;
      height: auto;
      max-height: 88vh;
      background: #ffdeeb;
      border: 3px solid #ffffff;
      border-radius: 35px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(180, 40, 90, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .expanded-img-wrapper {
      width: 100%;
      height: 62vh;
      max-height: 480px;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .expanded-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .expanded-message {
      margin-top: 15px;
      padding: 10px 15px;
      color: #8c0e3e;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .close-hint {
      position: absolute;
      top: -35px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* FINAL THANK YOU MODAL CARD STYLING */
    .final-modal-card {
      width: 90%;
      max-width: 380px;
      background: #f4efe6;
      border: 2px dashed #b8860b;
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .final-modal-icons {
      font-size: 24px;
      margin-bottom: 15px;
      display: flex;
      gap: 8px;
    }

    .final-modal-title {
      font-size: 20px;
      color: #8b0000;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .final-modal-text {
      font-size: 15px;
      color: #4a4a4a;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .final-modal-sub {
      font-size: 12px;
      color: #a0522d;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .final-close-btn {
